<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de trabajos – Servicio técnico</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--ac:#1f6feb;--dg:#c62828;--hd:#eef1f6;--ok:#0f8a5f}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12151b;--card:#1b2029;--tx:#e8ebf1;--mut:#9aa3b2;--bd:#2d3442;--ac:#5b9dff;--dg:#ff7b7b;--hd:#232a36;--ok:#3ecf9b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.w{max-width:1150px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:4px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--ac);color:#fff;font-weight:600}
button:disabled{opacity:.6;cursor:wait}
button.s{background:var(--hd);color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--dg);padding:4px 8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:860px}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{background:var(--hd);font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;background:var(--hd)}
.empty{color:var(--mut);text-align:center;padding:24px}
.hint{font-size:.82rem;color:var(--mut);margin:10px 0 0}
#gan{font-weight:700;color:var(--ok)}
#est{font-size:.85rem}
</style>
</head>
<body>
<div class="w">
<h1>🔧 Registro de trabajos – Servicio técnico</h1>

<div class="card">
<form id="f">
<label>Fecha<input type="date" id="fecha" required></label>
<label>N.º de orden<input type="text" id="orden" required></label>
<label>Marca<input type="text" id="marca" required></label>
<label>Modelo<input type="text" id="modelo" required></label>
<label>Trabajo realizado<input type="text" id="trabajo" required></label>
<label>Precio que pagó el cliente<input type="number" id="cliente" min="0" step="any" required></label>
<label>Precio del repuesto<input type="number" id="repuesto" min="0" step="any" value="0" required></label>
<label>Tipo de trabajo
<select id="tipo"><option value="s">Simple (30 % de la ganancia)</option><option value="c">Complejo (50 % de la ganancia)</option></select></label>
<div class="full">Ganancia (cliente − repuesto): <span id="gan">$0</span></div>
<div class="row full">
<button type="submit" id="add">➕ Agregar al registro</button>
<button type="button" class="s" id="sync">🔄 Sincronizar</button>
<button type="button" class="s" id="cfg">⚙️ Conectar Google Sheets</button>
<button type="button" class="s" id="copiar">📋 Copiar tabla</button>
<button type="button" class="s" id="borrar">🗑 Vaciar</button>
</div>
</form>
<p class="hint" id="est"></p>
</div>

<div class="card tw">
<table>
<thead><tr><th>Fecha</th><th>N.º orden</th><th>Marca</th><th>Modelo</th><th>Trabajo</th><th class="n">Cliente pagó</th><th class="n">Repuesto</th><th class="n">Ganancia</th><th class="n">Simples 30 %</th><th class="n">Complejos 50 %</th><th></th></tr></thead>
<tbody id="b"></tbody>
<tfoot id="p"></tfoot>
</table>
</div>
</div>

<script>
/* Pega aquí la URL de tu Apps Script (termina en /exec) para que todos tus dispositivos la usen sin configurar nada. */
const URL_SHEETS = "https://script.google.com/macros/s/AKfycbyHuXn36PRhByfhhB-O6KfFW0eWhDAzL0wPAw5vfh6jx6e3QqegZ4S8O_QWpHaDLgXy/exec";

const KEY="registro-st-v2", KURL="registro-st-url";
const $=id=>document.getElementById(id);
let data=[]; try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const getUrl=()=>URL_SHEETS||localStorage.getItem(KURL)||"";
const money=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("es-CL");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fdate=d=>{const [y,m,x]=String(d).split("-");return x?`${x}-${m}-${y}`:d};
const gan=r=>(r.cliente||0)-(r.repuesto||0);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const est=(t)=>$("est").textContent=t;
function hoy(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
$("fecha").value=hoy();

function liveGan(){$("gan").textContent=money((parseFloat($("cliente").value)||0)-(parseFloat($("repuesto").value)||0))}
$("cliente").oninput=$("repuesto").oninput=liveGan;

function render(){
  if(!data.length){$("b").innerHTML='<tr><td colspan="11" class="empty">Aún no hay trabajos registrados.</td></tr>';$("p").innerHTML="";return}
  let tc=0,tr=0,tg=0,ts=0,tx=0;
  $("b").innerHTML=data.map((r,i)=>{
    const g=gan(r), s=r.tipo==="s"?g*0.3:null, c=r.tipo==="c"?g*0.5:null;
    tc+=r.cliente;tr+=r.repuesto;tg+=g;if(s!==null)ts+=s;if(c!==null)tx+=c;
    return `<tr><td>${fdate(r.fecha)}</td><td>${esc(r.orden)}</td><td>${esc(r.marca)}</td><td>${esc(r.modelo)}</td><td>${esc(r.trabajo)}</td><td class="n">${money(r.cliente)}</td><td class="n">${money(r.repuesto)}</td><td class="n">${money(g)}</td><td class="n">${s!==null?money(s):""}</td><td class="n">${c!==null?money(c):""}</td><td><button class="d" data-i="${i}" title="Eliminar">✕</button></td></tr>`;
  }).join("");
  $("p").innerHTML=`<tr><td colspan="5">TOTALES</td><td class="n">${money(tc)}</td><td class="n">${money(tr)}</td><td class="n">${money(tg)}</td><td class="n">${money(ts)}</td><td class="n">${money(tx)}</td><td></td></tr>`;
}

async function post(obj){
  const u=getUrl(); if(!u) return false;
  try{await fetch(u,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)});return true}
  catch(e){return false}
}
async function cargar(){
  const u=getUrl();
  if(!u){est("Modo local: los datos solo están en este dispositivo. Usa «Conectar Google Sheets» para verlos en todos lados.");return}
  est("Sincronizando…");
  try{
    const r=await fetch(u,{redirect:"follow"}); const j=await r.json();
    if(!Array.isArray(j)) throw 0;
    data=j; save(); render(); est("✅ Sincronizado con Google Sheets · "+new Date().toLocaleTimeString("es-CL"));
  }catch(e){est("⚠️ Sin conexión con Google Sheets. Se muestran los datos guardados en este dispositivo.")}
}

$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const row={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),fecha:$("fecha").value,orden:$("orden").value.trim(),marca:$("marca").value.trim(),modelo:$("modelo").value.trim(),trabajo:$("trabajo").value.trim(),cliente:parseFloat($("cliente").value)||0,repuesto:parseFloat($("repuesto").value)||0,tipo:$("tipo").value};
  data.push(row); save(); render();
  ["orden","marca","modelo","trabajo","cliente"].forEach(id=>$(id).value=""); $("repuesto").value="0"; liveGan(); $("orden").focus();
  if(getUrl()){$("add").disabled=true;est("Guardando en Google Sheets…");const ok=await post({action:"add",row});$("add").disabled=false;if(ok)await cargar();else est("⚠️ No se pudo guardar en Sheets; quedó solo en este dispositivo.")}
});
$("b").addEventListener("click",async e=>{
  const i=e.target.dataset.i; if(i===undefined||!confirm("¿Eliminar este registro?"))return;
  const [r]=data.splice(+i,1); save(); render();
  if(getUrl()){await post({action:"delete",id:r.id});await cargar()}
});
$("borrar").onclick=async()=>{
  if(!data.length||!confirm("¿Vaciar TODO el registro (también en Google Sheets)?"))return;
  data=[];save();render(); if(getUrl()){await post({action:"clear"});await cargar()}
};
$("sync").onclick=cargar;
$("cfg").onclick=()=>{
  const u=prompt("Pega la URL de tu Apps Script (termina en /exec). Déjala vacía para desconectar:",getUrl());
  if(u===null)return;
  try{u.trim()?localStorage.setItem(KURL,u.trim()):localStorage.removeItem(KURL)}catch(e){}
  cargar();
};
$("copiar").onclick=async()=>{
  const h=["Fecha","Nro de orden","Marca","Modelo","Trabajo","Precio cliente","Precio repuesto","Ganancia","Simples 30%","Complejos 50%"];
  const rows=data.map(r=>{const g=gan(r);return [fdate(r.fecha),r.orden,r.marca,r.modelo,r.trabajo,r.cliente,r.repuesto,g,r.tipo==="s"?g*0.3:"",r.tipo==="c"?g*0.5:""].join("\t")});
  const txt=[h.join("\t"),...rows].join("\n");
  try{await navigator.clipboard.writeText(txt);est("✅ Tabla copiada.")}
  catch(e){const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");est("✅ Tabla copiada.")}catch(_){est("No se pudo copiar.")}t.remove()}
};
render(); cargar();
</script>
</body>
</html>
