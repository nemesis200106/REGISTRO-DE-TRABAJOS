<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de trabajos – Servicio técnico</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--ac:#1f6feb;--ac2:#0f8a5f;--dg:#c62828;--hd:#eef1f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151b;--card:#1b2029;--tx:#e8ebf1;--mut:#9aa3b2;--bd:#2d3442;--ac:#5b9dff;--ac2:#3ecf9b;--dg:#ff7b7b;--hd:#232a36}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151b;--card:#1b2029;--tx:#e8ebf1;--mut:#9aa3b2;--bd:#2d3442;--ac:#5b9dff;--ac2:#3ecf9b;--dg:#ff7b7b;--hd:#232a36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.w{max-width:1100px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:4px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--ac);color:#fff;font-weight:600}
button.s{background:var(--hd);color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--dg);padding:4px 8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:760px}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{background:var(--hd);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;background:var(--hd)}
.empty{color:var(--mut);text-align:center;padding:24px}
.hint{font-size:.8rem;color:var(--mut)}
</style>
</head>
<body>
<div class="w">
<h1>🔧 Registro de trabajos – Servicio técnico</h1>

<div class="card">
<form id="f">
<label>Fecha<input type="date" id="fecha" required></label>
<label>N.º de orden<input type="text" id="orden" required></label>
<label>Marca<input type="text" id="marca" required></label>
<label>Modelo<input type="text" id="modelo" required></label>
<label>Trabajo realizado<input type="text" id="trabajo" required></label>
<label>Precio<input type="number" id="precio" min="0" step="any" required></label>
<label>Tipo de trabajo
<select id="tipo"><option value="s">Simple (30 %)</option><option value="c">Complejo (50 %)</option></select></label>
<div class="row full"><button type="submit">➕ Agregar al registro</button>
<button type="button" class="s" id="copiar">📋 Copiar tabla (para Excel)</button>
<button type="button" class="s" id="borrar">🗑 Vaciar registro</button></div>
</form>
<p class="hint" id="msg">Los datos se guardan automáticamente en este navegador.</p>
</div>

<div class="card tw">
<table id="t">
<thead><tr><th>Fecha</th><th>N.º orden</th><th>Marca</th><th>Modelo</th><th>Trabajo</th><th class="n">Precio</th><th class="n">Simples 30 %</th><th class="n">Complejos 50 %</th><th></th></tr></thead>
<tbody id="b"></tbody>
<tfoot id="p"></tfoot>
</table>
</div>
</div>
<script>
const KEY="registro-servicio-tecnico";
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
const $=id=>document.getElementById(id);
const money=n=>"$"+Math.round(n).toLocaleString("es-CL");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fdate=d=>{const [y,m,day]=d.split("-");return `${day}-${m}-${y}`};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
$("fecha").value=today();
function render(){
  const b=$("b");
  if(!data.length){b.innerHTML='<tr><td colspan="9" class="empty">Aún no hay trabajos registrados.</td></tr>';$("p").innerHTML="";return}
  let ts=0,tc=0,tp=0;
  b.innerHTML=data.map((r,i)=>{
    const s=r.tipo==="s"?r.precio*0.3:null, c=r.tipo==="c"?r.precio*0.5:null;
    tp+=r.precio; if(s!==null)ts+=s; if(c!==null)tc+=c;
    return `<tr><td>${fdate(r.fecha)}</td><td>${esc(r.orden)}</td><td>${esc(r.marca)}</td><td>${esc(r.modelo)}</td><td>${esc(r.trabajo)}</td><td class="n">${money(r.precio)}</td><td class="n">${s!==null?money(s):""}</td><td class="n">${c!==null?money(c):""}</td><td><button class="d" data-i="${i}" title="Eliminar">✕</button></td></tr>`;
  }).join("");
  $("p").innerHTML=`<tr><td colspan="5">TOTALES</td><td class="n">${money(tp)}</td><td class="n">${money(ts)}</td><td class="n">${money(tc)}</td><td></td></tr>`;
}
$("f").addEventListener("submit",e=>{
  e.preventDefault();
  data.push({fecha:$("fecha").value,orden:$("orden").value.trim(),marca:$("marca").value.trim(),modelo:$("modelo").value.trim(),trabajo:$("trabajo").value.trim(),precio:parseFloat($("precio").value)||0,tipo:$("tipo").value});
  save();render();
  ["orden","marca","modelo","trabajo","precio"].forEach(id=>$(id).value="");
  $("orden").focus();
});
$("b").addEventListener("click",e=>{
  const i=e.target.dataset.i;
  if(i!==undefined&&confirm("¿Eliminar este registro?")){data.splice(+i,1);save();render()}
});
$("borrar").onclick=()=>{if(data.length&&confirm("¿Vaciar todo el registro?")){data=[];save();render()}};
$("copiar").onclick=async()=>{
  const h=["Fecha","Nro de orden","Marca","Modelo","Trabajo","Precio","Simples 30%","Complejos 50%"];
  const rows=data.map(r=>[fdate(r.fecha),r.orden,r.marca,r.modelo,r.trabajo,r.precio,r.tipo==="s"?r.precio*0.3:"",r.tipo==="c"?r.precio*0.5:""].join("\t"));
  const txt=[h.join("\t"),...rows].join("\n");
  try{await navigator.clipboard.writeText(txt);$("msg").textContent="✅ Tabla copiada. Pégala en Excel o Google Sheets."}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");$("msg").textContent="✅ Tabla copiada. Pégala en Excel o Google Sheets."}catch(_){$("msg").textContent="No se pudo copiar."}
    ta.remove()}
};
render();
</script>
</body>
</html>
